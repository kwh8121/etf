name: KR daily ETF signals

on:
  schedule:
    - cron: "15 10 * * 1-5"
  workflow_dispatch:
    inputs:
      market_date:
        description: "KRX 기준일 (YYYYMMDD, 비우면 KST 오늘)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: kr-daily-production
  cancel-in-progress: false

jobs:
  ingest-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
      KIWOOM_APP_KEY: ${{ secrets.KIWOOM_APP_KEY }}
      KIWOOM_SECRET_KEY: ${{ secrets.KIWOOM_SECRET_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run daily:kr -- "${{ inputs.market_date }}"
