name: US ETF movers (P1 experimental)

on:
  # 화~토 07:30 KST(미국 월~금 장 마감 후)에 runner PC의 systemd timer가 실행한다.
  # GitHub schedule은 지연·누락이 잦아 쓰지 않는다 (scripts/dispatch-scheduled-workflow.ts).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: us-etf-movers-p1
  cancel-in-progress: false

jobs:
  ingest-and-report:
    # Kiwoom은 등록된 IP에서만 토큰을 발급하므로 등록 IP의 self-hosted runner에서 실행한다.
    runs-on: [self-hosted, linux, x64, kiwoom]
    timeout-minutes: 15
    environment: staging
    env:
      # 한국→Telegram 왕복이 node 기본 연결 시도 제한(250ms)을 넘어 ETIMEDOUT이 난다.
      NODE_OPTIONS: --network-family-autoselection-attempt-timeout=2000
      ENABLE_US_ETF_P1: ${{ vars.ENABLE_US_ETF_P1 }}
      # Q-05 검증에서만 US를 설정한다. 기본값은 빈 값이며 PENDING 직후 실패한다.
      ETF_SIGNAL_TEST_FAIL_AFTER_PENDING: ${{ vars.ETF_SIGNAL_TEST_FAIL_AFTER_PENDING }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KIWOOM_APP_KEY: ${{ secrets.KIWOOM_APP_KEY }}
      KIWOOM_SECRET_KEY: ${{ secrets.KIWOOM_SECRET_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - id: ingest
        run: npm run ingest:us-movers
      - if: steps.ingest.outputs.duplicate != 'true' && steps.ingest.outputs.run_id != ''
        run: npm run report:us-movers -- --run-id=${{ steps.ingest.outputs.run_id }}
