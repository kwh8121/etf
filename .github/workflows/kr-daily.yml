name: KR daily ETF signals

on:
  # 평일 09:30 KST에 runner PC의 systemd timer가 누락일 보충을 요청한다.
  # GitHub schedule은 지연·누락이 잦아 쓰지 않는다 (scripts/dispatch-scheduled-workflow.ts).
  workflow_dispatch:
    inputs:
      market_date:
        description: "KRX 기준일 (YYYYMMDD, 비우면 KST 오늘)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: kr-daily-production
  cancel-in-progress: false

jobs:
  ingest-and-report:
    # Kiwoom은 등록된 IP에서만 토큰을 발급하므로 등록 IP의 self-hosted runner에서 실행한다.
    runs-on: [self-hosted, linux, x64, kiwoom]
    timeout-minutes: 60
    environment: production
    env:
      # 한국→Telegram 왕복이 node 기본 연결 시도 제한(250ms)을 넘어 ETIMEDOUT이 난다.
      NODE_OPTIONS: --network-family-autoselection-attempt-timeout=2000
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
      KIWOOM_APP_KEY: ${{ secrets.KIWOOM_APP_KEY }}
      KIWOOM_SECRET_KEY: ${{ secrets.KIWOOM_SECRET_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: KR 누락일 보충 또는 지정일 수동 실행
        env:
          MARKET_DATE: ${{ inputs.market_date }}
        run: |
          if [ -n "$MARKET_DATE" ]; then
            npm run daily:kr -- "$MARKET_DATE"
          else
            npm run catchup:kr
          fi
